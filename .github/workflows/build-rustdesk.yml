name: RustDesk Build Windows
run-name: Build RustDesk Windows

on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./web/package-lock.json

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: NPM install & build web frontend
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Cargo build release (no‑vpn，仅exe，不打包MSI)
        run: cargo build --release --features no-vpn
        env:
          TAURI_SKIP_MSI: true

      - name: Upload artifact rustdesk.exe
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: target/release/rustdesk.exe
