name: Build Custom RustDesk (Exact line replace)
run-name: Build custom rustdesk exact‑line replace

on:
  workflow_dispatch:

env:
  RUSTDESK_BRANCH: "master"

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RENDEZVOUS_SERVER: ${{ secrets.RD_RENDEZVOUS_SERVER }}
      RS_PUB_KEY: ${{ secrets.RD_RS_PUB_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone official rustdesk source + submodules
        run: |
          git clone --recursive --depth 1 --branch $env:RUSTDESK_BRANCH https://github.com/rustdesk/rustdesk.git src
        shell: pwsh

      - name: Exact replace config.rs Windows
        run: |
          $fp = "src/libs/hbb_common/src/config.rs"
          $raw = Get-Content $fp -Raw
          # 原版完整行，从官方master复制
          $oldServerLine = 'pub const RENDEZVOUS_SERVERS: &''static [&''static str] = &["rustdesk.com"];'
          $newServerLine = "pub const RENDEZVOUS_SERVERS: &'static [&'static str] = &[\"$env:RENDEZVOUS_SERVER\"];"

          $oldKeyLine = 'pub const RS_PUB_KEY: &''static str = "**********";'
          $newKeyLine = "pub const RS_PUB_KEY: &'static str = `"$env:RS_PUB_KEY`";"

          $oldFlagLine = "custom_rendezvous_server: false"
          $newFlagLine = "custom_rendezvous_server: true"

          $raw = $raw.Replace($oldServerLine,$newServerLine)
          $raw = $raw.Replace($oldKeyLine,$newKeyLine)
          $raw = $raw.Replace($oldFlagLine,$newFlagLine)

          $raw | Out-File $fp -Encoding utf8NoBOM -Newline LF
        shell: pwsh

      - name: Verify result
        working-directory: ./src
        run: |
          Select-String libs/hbb_common/src/config.rs -Pattern "RENDEZVOUS_SERVERS|RS_PUB_KEY|custom_rendezvous_server"
        shell: pwsh

      - name: Setup Flutter & Rust Windows
        uses: ./src/.github/actions/setup-flutter-rust-windows

      - name: Build Windows
        working-directory: ./src
        run: |
          flutter pub get
          flutter windows --release
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-custom
          path: src/build/windows/x64/runner/Release/


  build-linux:
    runs-on: ubuntu-latest
    env:
      RENDEZVOUS_SERVER: ${{ secrets.RD_RENDEZVOUS_SERVER }}
      RS_PUB_KEY: ${{ secrets.RD_RS_PUB_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone official rustdesk source + submodules
        run: |
          git clone --recursive --depth 1 --branch ${RUSTDESK_BRANCH} https://github.com/rustdesk/rustdesk.git src

      - name: Exact line replace Linux
        run: |
          FILE=src/libs/hbb_common/src/config.rs
          # 注意：这里填入官方master原版完整原始行
          OLD_SERVER='pub const RENDEZVOUS_SERVERS: &'\''static [&'\''static str] = &["rustdesk.com"];'
          NEW_SERVER='pub const RENDEZVOUS_SERVERS: &'\''static [&'\''static str] = &["'"${RENDEZVOUS_SERVER}"'"];'

          OLD_KEY='pub const RS_PUB_KEY: &'\''static str = "**********";'
          NEW_KEY='pub const RS_PUB_KEY: &'\''static str = "'"${RS_PUB_KEY}"'";'

          sed -i.bak "s|${OLD_SERVER}|${NEW_SERVER}|g" "$FILE"
          sed -i.bak "s|${OLD_KEY}|${NEW_KEY}|g" "$FILE"
          sed -i.bak 's/custom_rendezvous_server: false/custom_rendezvous_server: true/g' "$FILE"
          rm -f "${FILE}.bak"

      - name: Verify
        working-directory: ./src
        run: |
          grep -n "RENDEZVOUS_SERVERS\|RS_PUB_KEY\|custom_rendezvous_server" libs/hbb_common/src/config.rs

      - name: Setup Flutter & Rust Linux
        uses: ./src/.github/actions/setup-flutter-rust-linux

      - name: Build Linux
        working-directory: ./src
        run: |
          flutter pub get
          flutter build linux --release

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux-custom
          path: src/build/linux/x64/release/bundle/
