name: RustDesk Build Windows
run-name: Build RustDesk Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release/deps
          key: ${{ runner.os }}-rustdesk-cargo-${{ hashFiles('**/Cargo.toml','**/Cargo.lock') }}

      - name: NPM install & build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cargo build release (no‑vpn，仅exe)
        run: cargo build --release --features no-vpn
        env:
          TAURI_SKIP_MSI: true

      - name: Upload artifact rustdesk.exe
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: target/release/rustdesk.exe
