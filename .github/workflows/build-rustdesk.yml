name: Build Custom RustDesk (diff patch)
run-name: Build custom rustdesk with diff patch

on:
  workflow_dispatch:

env:
  RUSTDESK_BRANCH: "master" # 可改为tag，例如 "1.3.7"

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RENDEZVOUS_SERVER: ${{ secrets.RD_RENDEZVOUS_SERVER }}
      RS_PUB_KEY: ${{ secrets.RD_RS_PUB_KEY }}
    steps:
      - name: Checkout this small repo (workflow + patch template)
        uses: actions/checkout@v4

      - name: Clone official rustdesk source + submodules
        run: |
          git clone --recursive --depth 1 --branch $env:RUSTDESK_BRANCH https://github.com/rustdesk/rustdesk.git src
        shell: pwsh

      - name: Generate real diff from template (Windows)
        run: |
          $template = ".github/patches/config.rs.template.diff"
          $outDiff = "src/config.rs.patch"
          $content = Get-Content $template -Raw
          $content = $content -replace '__RD_SERVER__',"$env:RENDEZVOUS_SERVER"
          $content = $content -replace '__RD_PUBKEY__',"$env:RS_PUB_KEY"
          Set-Content $outDiff -Value $content -NoNewline
        shell: pwsh

      - name: Apply patch
        working-directory: ./src
        run: |
          git apply config.rs.patch
        shell: pwsh

      - name: Verify patched config.rs
        working-directory: ./src
        run: |
          Select-String libs/hbb_common/src/config.rs -Pattern "RENDEZVOUS_SERVERS|RS_PUB_KEY|custom_rendezvous_server"
        shell: pwsh

      - name: Setup Flutter & Rust Windows
        uses: ./src/.github/actions/setup-flutter-rust-windows

      - name: Build Flutter Windows Release
        working-directory: ./src
        run: |
          flutter pub get
          flutter windows --release
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-custom
          path: src/build/windows/x64/runner/Release/

  build-linux:
    runs-on: ubuntu-latest
    env:
      RENDEZVOUS_SERVER: ${{ secrets.RD_RENDEZVOUS_SERVER }}
      RS_PUB_KEY: ${{ secrets.RD_RS_PUB_KEY }}
    steps:
      - name: Checkout this small repo
        uses: actions/checkout@v4

      - name: Clone official rustdesk source + submodules
        run: |
          git clone --recursive --depth 1 --branch ${RUSTDESK_BRANCH} https://github.com/rustdesk/rustdesk.git src

      - name: Generate real diff patch(Linux)
        run: |
          sed -e "s|__RD_SERVER__|${RENDEZVOUS_SERVER}|g" \
              -e "s|__RD_PUBKEY__|${RS_PUB_KEY}|g" \
              .github/patches/config.rs.template.diff > src/config.rs.patch

      - name: Apply git patch
        working-directory: ./src
        run: |
          git apply config.rs.patch

      - name: Verify patched config.rs
        working-directory: ./src
        run: |
          grep -n "RENDEZVOUS_SERVERS\|RS_PUB_KEY\|custom_rendezvous_server" libs/hbb_common/src/config.rs

      - name: Setup Flutter & Rust Linux
        uses: ./src/.github/actions/setup-flutter-rust-linux

      - name: Build Linux Release
        working-directory: ./src
        run: |
          flutter pub get
          flutter build linux --release

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux-custom
          path: src/build/linux/x64/release/bundle/
