name: RustDesk Build Windows
run-name: Build RustDesk Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RELAY_SERVER: ${{ secrets.RD_RELAY_SERVER }}
      RELAY_KEY: ${{ secrets.RD_RELAY_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release/deps
          key: ${{ runner.os }}-rustdesk-cargo-${{ hashFiles('**/Cargo.toml','**/Cargo.lock') }}

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build
        shell: pwsh

      - name: Cargo build release (no‑vpn, inject custom server)
        run: cargo build --release --features no-vpn
        env:
          TAURI_SKIP_MSI: true
          RELAY_SERVER: ${{ env.RELAY_SERVER }}
          RELAY_KEY: ${{ env.RELAY_KEY }}

      - name: Upload artifact rustdesk.exe
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: target/release/rustdesk.exe
